<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support Webinaire – Slides plein écran</title>

  <!-- Font (optionnel) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      /* Look & feel "Mobinter-like" : clair, épuré, très lisible */
      --bg:#f6f8fb;
      --panel:#ffffff;
      --ink:#0b1220;
      --muted:#52607a;
      --line:rgba(11,18,32,.10);

      --accent:#ff7a18;    /* accent jeune */
      --accent2:#1f6fff;   /* bleu dynamique */
      --good:#15b77e;
      --warn:#ffb020;

      --shadow: 0 18px 50px rgba(11,18,32,.10);
      --radius: 26px;
      --radius2: 18px;

      --maxw: 1100px;
      --pad: 28px;

      --h1: clamp(34px, 5vw, 62px);
      --h2: clamp(20px, 2.2vw, 28px);
      --p:  clamp(16px, 1.4vw, 18px);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--ink);
      background: var(--bg);
      overflow:hidden; /* on scroll dans le container */
    }
    a{color:inherit; text-decoration:none}

    /* Topbar minimal */
    .topbar{
      position:fixed;
      top:0; left:0; right:0;
      height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 18px;
      background: rgba(246,248,251,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
      z-index:50;
    }
    .brand{
      display:flex;
      gap:10px;
      align-items:center;
      min-width: 260px;
    }
    .brand__mark{
      width:40px; height:40px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      font-weight:900;
      letter-spacing:.5px;
      color:#fff;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
    }
    .brand__title{
      font-weight:900;
      letter-spacing:.2px;
      font-size:13px;
      text-transform: uppercase;
    }
    .brand__subtitle{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    .topbar__right{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .chip{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 999px;
      padding:8px 10px;
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:8px;
      align-items:center;
      box-shadow: 0 8px 20px rgba(11,18,32,.06);
    }
    .chip b{color:var(--ink)}
    .btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 999px;
      padding:10px 12px;
      cursor:pointer;
      font-weight:800;
      font-size:12px;
      color:var(--ink);
      box-shadow: 0 8px 20px rgba(11,18,32,.06);
      transition: transform .05s ease, box-shadow .2s ease, border .2s ease;
    }
    .btn:hover{box-shadow: 0 14px 32px rgba(11,18,32,.10)}
    .btn:active{transform: translateY(1px)}
    .btn--accent{
      border-color: rgba(255,122,24,.35);
      background: linear-gradient(135deg, rgba(255,122,24,.95), rgba(255,122,24,.75));
      color:#fff;
    }

    /* Container scroll "slides" */
    .deck{
      position:fixed;
      inset:64px 0 64px 0; /* topbar + bottombar */
      overflow:auto;
      scroll-snap-type: y mandatory;
      scroll-behavior:smooth;
    }

    /* Slide = section full viewport */
    .slide{
      min-height: calc(100vh - 128px);
      display:grid;
      place-items:center;
      padding: 24px 18px;
      scroll-snap-align: start;
    }

    .panel{
      width:min(var(--maxw), 100%);
      background: var(--panel);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--pad);
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    /* Typo hierarchy */
    .kicker{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      color:var(--muted);
      font-weight:800;
      font-size:12px;
      text-transform: uppercase;
      letter-spacing:.6px;
    }
    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background: var(--accent2);
      box-shadow: 0 0 0 5px rgba(31,111,255,.12);
    }

    .h1{
      margin:0;
      text-align:center;
      font-size: var(--h1);
      line-height:1.03;
      letter-spacing:-.8px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .subtitle{
      margin:0;
      text-align:center;
      font-size: var(--h2);
      line-height:1.25;
      color: var(--muted);
      font-weight: 700;
      max-width: 60ch;
      margin-inline:auto;
    }
    .p{
      margin:0;
      font-size: var(--p);
      line-height:1.45;
      color: var(--muted);
      max-width: 78ch;
      margin-inline:auto;
      text-align:center;
    }
    .hr{
      height:1px;
      background: var(--line);
      width:100%;
      margin: 6px 0;
    }

    /* Layout blocks */
    .grid{display:grid; gap:12px}
    .grid.cols-2{grid-template-columns: repeat(2, minmax(0,1fr))}
    .grid.cols-3{grid-template-columns: repeat(3, minmax(0,1fr))}
    @media (max-width: 860px){
      .grid.cols-2,.grid.cols-3{grid-template-columns:1fr}
      .topbar__right .chip{display:none}
    }

    .card{
      border:1px solid var(--line);
      background:#fff;
      border-radius: var(--radius2);
      padding: 14px 14px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .card__t{
      font-weight: 900;
      letter-spacing: -.2px;
      font-size: 16px;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .card__d{
      color: var(--muted);
      font-size: 13px;
      line-height:1.35;
    }
    .pillrow{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
    .pill{
      border:1px solid var(--line);
      border-radius:999px;
      padding:8px 10px;
      background: #fff;
      font-weight:900;
      font-size:12px;
      color: var(--ink);
    }
    .pill--good{border-color: rgba(21,183,126,.25)}
    .pill--warn{border-color: rgba(255,176,32,.25)}
    .pill--accent{border-color: rgba(255,122,24,.25)}
    .pill--blue{border-color: rgba(31,111,255,.25)}

    /* Simple lists, "phrases courtes" */
    .bullets{
      margin:0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 15px;
      line-height:1.45;
    }
    .bullets li{margin:6px 0}

    /* CTA strip */
    .cta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      margin-top: 4px;
    }

    /* Bottom navigation */
    .bottombar{
      position:fixed;
      left:0; right:0; bottom:0;
      height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 18px;
      background: rgba(246,248,251,.92);
      backdrop-filter: blur(10px);
      border-top:1px solid var(--line);
      z-index:50;
    }
    .navleft{display:flex; gap:10px; align-items:center; width:55%}
    .navright{display:flex; gap:10px; align-items:center}
    .progress{
      flex:1;
      height:10px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      overflow:hidden;
    }
    .progress__bar{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
    }

    /* Modal (images/ressources) */
    .modal{position:fixed; inset:0; display:none; z-index:80}
    .modal[aria-hidden="false"]{display:block}
    .modal__backdrop{position:absolute; inset:0; background: rgba(11,18,32,.55)}
    .modal__panel{
      position:relative;
      width:min(980px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      margin: 12px auto;
      border-radius: 22px;
      background:#fff;
      border:1px solid var(--line);
      box-shadow: 0 30px 90px rgba(11,18,32,.20);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .modal__head{
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
      background: #fff;
    }
    .modal__title{
      font-weight: 900;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing:.5px;
    }
    .modal__body{
      padding:16px;
      overflow:auto;
      color: var(--ink);
    }
    .modal__foot{
      padding:14px 16px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:flex-end;
      gap:10px;
      background:#fff;
    }

    /* "Image bandeau" cliquable */
    .banner{
      border:1px solid var(--line);
      border-radius: var(--radius2);
      background: #fff;
      padding: 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      transition: box-shadow .2s ease, transform .05s ease;
    }
    .banner:hover{box-shadow: 0 16px 36px rgba(11,18,32,.12)}
    .banner:active{transform: translateY(1px)}
    .banner__left{display:flex; flex-direction:column; gap:4px}
    .banner__t{font-weight:900}
    .banner__d{color:var(--muted); font-size:13px}
    .banner__tag{
      font-weight:900;
      color: var(--accent2);
      font-size:12px;
    }

    /* Small helper */
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      border:1px solid var(--line);
      background:#fff;
      border-radius:10px;
      padding:3px 7px;
      font-size:12px;
      font-weight:900;
      color: var(--ink);
    }
  </style>
</head>

<body>
  <!-- Top -->
  <header class="topbar">
    <div class="brand">
      <div class="brand__mark">MLPB</div>
      <div>
        <div class="brand__title">Support webinaire</div>
        <div class="brand__subtitle">Slides plein écran – style pédagogique épuré</div>
      </div>
    </div>

    <div class="topbar__right">
      <div class="chip">Slide <b id="slideIndex">1</b>/<span id="slideTotal">--</span></div>
      <button class="btn" id="btnHelp" type="button">Aide</button>
    </div>
  </header>

  <!-- Deck scroll -->
  <main class="deck" id="deck" aria-live="polite">
    <!-- sections injected -->
  </main>

  <!-- Bottom nav -->
  <footer class="bottombar">
    <div class="navleft">
      <button class="btn" id="btnPrev" type="button" title="Précédent (←)">←</button>
      <button class="btn" id="btnNext" type="button" title="Suivant (→)">→</button>
      <div class="progress"><div class="progress__bar" id="progressBar"></div></div>
    </div>
    <div class="navright">
      <a class="btn btn--accent" href="https://mlpb-tools.github.io/Map-Ta-Mob/" target="_blank" rel="noreferrer">🧭 Map-Ta-Mob</a>
    </div>
  </footer>

  <!-- Modal -->
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal__backdrop" data-close="1"></div>
    <div class="modal__panel">
      <div class="modal__head">
        <div class="modal__title" id="modalTitle">Ressource</div>
        <button class="btn" data-close="1" type="button">Fermer</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__foot">
        <button class="btn" data-close="1" type="button">OK</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      "use strict";

      // --------------------------------------------
      // SLIDES (structure "Mobinter-like")
      // Tu peux remplacer/compléter les contenus ici.
      // --------------------------------------------
      const SLIDES = [
        {
          kicker: "🧭 WEBINAIRE MOBILITÉ",

          content: `
            <div class="grid cols-3">

              <div class="card">

                <div class="card__d">Ta réalité sur une carte (Map-Ta-Mob).</div>
              </div>
              <div class="card">
                <div class="card__t">🚀 3) Agir</div>
                <div class="card__d">Choisir une solution + une aide possible.</div>

            </div>
            <div class="hr"></div>
            <ul class="bullets">
              <li>Pas un test. Pas de jugement.</li>
              <li>On cherche <b>le plus réaliste</b> (maintenant) + <b>le plus durable</b> (après).</li>
            </ul>
          `
        },
        {
          kicker: "🧩 ACTIVITÉ",
          title: "MAP-TA-MOB",
          subtitle: "On dessine ta mobilité réelle.",
          content: `
            <div class="grid cols-2">
              <div class="card">
                <div class="card__t">📝 Consigne</div>
                <div class="card__d">Place : départ, lieux importants, moyens actuels, freins.</div>
              </div>
              <div class="card">
                <div class="card__t">⏳ Timing</div>
                <div class="card__d">10 minutes (puis on débriefe ensemble).</div>
              </div>
            </div>
            <div class="cta">
              <a class="btn btn--accent" href="https://mlpb-tools.github.io/Map-Ta-Mob/" target="_blank" rel="noreferrer">🧭 Ouvrir Map-Ta-Mob</a>
              <span class="pill">Astuce : 1 lieu = 1 point</span>
            </div>
          `
        },
        {
          kicker: "🧠 DIAGNOSTIC",
          title: "CE QUI BLOQUE",
          subtitle: "On met des mots simples sur tes freins.",
          content: `
            <div class="grid cols-2">
              <div class="card">
                <div class="card__t">💸 Coût</div>
                <div class="card__d">Trop cher → pas possible sur la durée.</div>
              </div>
              <div class="card">
                <div class="card__t">⏳ Horaires</div>
                <div class="card__d">Correspondances / première / dernière.</div>
              </div>
              <div class="card">
                <div class="card__t">🚫 Pas de véhicule</div>
                <div class="card__d">Dépendance, impossibilité d’accepter.</div>
              </div>
              <div class="card">
                <div class="card__t">😮‍💨 Fatigue / stress</div>
                <div class="card__d">Trop compliqué → on simplifie.</div>
              </div>
            </div>
          `
        },

        // Ressources (bandeaux cliquables -> modal)
        {
          kicker: "📚 RESSOURCES",
          title: "LES SOLUTIONS",
          subtitle: "Clique pour ouvrir une fiche (simple).",
          content: `
            <div class="banner" data-modal="1" data-title="✅ Aide déplacements" data-body="Aide financière pour des trajets indispensables (emploi/formation/médical/justice/entretien). Plafond annuel : voir conditions avec ton conseiller.">
              <div class="banner__left">
                <div class="banner__t">✅ Aide aux déplacements</div>
                <div class="banner__d">Quand tu dois bouger pour un truc important.</div>
              </div>
              <div class="banner__tag">ouvrir →</div>
            </div>

            <div class="banner" data-modal="1" data-title="🚗 Réparation / assurance" data-body="Aides possibles si ton véhicule est indispensable (réparation, assurance). Toujours sur dossier + justificatifs.">
              <div class="banner__left">
                <div class="banner__t">🚗 Voiture : réparation / assurance</div>
                <div class="banner__d">Quand une panne ou l’assurance bloque tout.</div>
              </div>
              <div class="banner__tag">ouvrir →</div>
            </div>

            <div class="banner" data-modal="1" data-title="🚌 Tarification solidaire" data-body="Réductions possibles sur les transports (selon situation). Vérifier éligibilité et justificatifs.">
              <div class="banner__left">
                <div class="banner__t">🚌 Transports : tarification solidaire</div>
                <div class="banner__d">Quand le prix est le frein principal.</div>
              </div>
              <div class="banner__tag">ouvrir →</div>
            </div>

            <div class="banner" data-modal="1" data-title="🪪 Permis : code / conduite" data-body="Solutions pour financer le code et/ou des heures (selon conditions). Objectif : débloquer emploi/formation.">
              <div class="banner__left">
                <div class="banner__t">🪪 Permis : code / conduite</div>
                <div class="banner__d">Quand le permis est nécessaire au projet.</div>
              </div>
              <div class="banner__tag">ouvrir →</div>
            </div>
          `
        },

        {
          kicker: "📝 MODULE MÉTHODO",
          title: "CANDIDATURE",
          subtitle: "Se déplacer… c’est aussi savoir s’organiser.",
          content: `
            <div class="grid cols-2">
              <div class="card">
                <div class="card__t">✅ Avant</div>
                <div class="card__d">Je vérifie le trajet + je prévois un plan B.</div>
              </div>
              <div class="card">
                <div class="card__t">⏳ Le jour J</div>
                <div class="card__d">J’anticipe 15–20 min + je garde un numéro utile.</div>
              </div>
            </div>
            <ul class="bullets">
              <li>“Je peux venir” = je sais <b>comment</b> venir.</li>
              <li>Si imprévu : j’envoie un message <b>tout de suite</b>.</li>
            </ul>
          `
        },

        {
          kicker: "🤝 ACTIVITÉ GROUPE",
          title: "PLAN B",
          subtitle: "En 3 minutes, trouve une alternative réaliste.",
          content: `
            <div class="grid cols-3">
              <div class="card"><div class="card__t">1) Si bus impossible</div><div class="card__d">→ covoit / TAD / combo</div></div>
              <div class="card"><div class="card__t">2) Si trop cher</div><div class="card__d">→ tarif solidaire / aide</div></div>
              <div class="card"><div class="card__t">3) Si fatigue/stress</div><div class="card__d">→ simplifier 1 chose</div></div>
            </div>
            <div class="cta">
              <span class="pill">📝 1 phrase : “Mon plan B c’est…”</span>
            </div>
          `
        },

        {
          kicker: "🧾 FIN",
          title: "QUESTIONNAIRE",
          subtitle: "Dernière étape : on te recontacte si besoin.",
          content: `
            <p class="p">Complète le formulaire de fin : <b>ça nous permet de t’aider vite</b>.</p>
            <div class="cta">
              <a class="btn btn--accent" href="https://mlpb-tools.github.io/Map-Ta-Mob/" target="_blank" rel="noreferrer">🧩 Je complète</a>
              <span class="pill">✅ programme</span>
              <span class="pill">✅ destination</span>
              <span class="pill">✅ besoin d’aide (oui/non)</span>
            </div>
            <div class="hr"></div>
            <p class="p"><b>Raccourcis</b> : <span class="kbd">↑/↓</span> scroll • <span class="kbd">←/→</span> slide • <span class="kbd">Esc</span> fermer</p>
          `
        }
      ];

      // --------------------------------------------
      // Render
      // --------------------------------------------
      const deck = document.getElementById("deck");
      const slideIndexEl = document.getElementById("slideIndex");
      const slideTotalEl = document.getElementById("slideTotal");
      const progressBar = document.getElementById("progressBar");
      const btnPrev = document.getElementById("btnPrev");
      const btnNext = document.getElementById("btnNext");
      const btnHelp = document.getElementById("btnHelp");

      const modal = document.getElementById("modal");
      const modalTitle = document.getElementById("modalTitle");
      const modalBody = document.getElementById("modalBody");

      let current = 0;
      let slideEls = [];

      function escapeHtml(s){
        return String(s)
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }

      function renderSlides(){
        deck.innerHTML = SLIDES.map((s, i) => `
          <section class="slide" data-i="${i}">
            <div class="panel">
              <div class="kicker"><span class="dot"></span> ${escapeHtml(s.kicker || "")}</div>
              <h1 class="h1">${escapeHtml(s.title || "")}</h1>
              <p class="subtitle">${escapeHtml(s.subtitle || "")}</p>
              <div class="hr"></div>
              <div>${s.content || ""}</div>
            </div>
          </section>
        `).join("");

        slideEls = Array.from(deck.querySelectorAll(".slide"));
        slideTotalEl.textContent = String(SLIDES.length);
        updateFromScroll(); // init
      }

      function scrollToSlide(i){
        const next = Math.max(0, Math.min(SLIDES.length - 1, i));
        const el = slideEls[next];
        if(!el) return;
        el.scrollIntoView({behavior:"smooth", block:"start"});
      }

      function updateUI(){
        slideIndexEl.textContent = String(current + 1);
        const pct = ((current + 1) / SLIDES.length) * 100;
        progressBar.style.width = pct.toFixed(2) + "%";
      }

      // Observe which slide is visible (snap)
      function updateFromScroll(){
        const rectDeck = deck.getBoundingClientRect();
        const midY = rectDeck.top + rectDeck.height * 0.35;

        let best = 0;
        let bestDist = Infinity;

        slideEls.forEach((el, i) => {
          const r = el.getBoundingClientRect();
          const dist = Math.abs((r.top + r.height * 0.25) - midY);
          if(dist < bestDist){
            bestDist = dist;
            best = i;
          }
        });

        if(best !== current){
          current = best;
          updateUI();
        }else{
          updateUI();
        }
      }

      // Modal
      function openModal(title, html){
        modalTitle.textContent = title;
        modalBody.innerHTML = html;
        modal.setAttribute("aria-hidden", "false");
      }
      function closeModal(){
        modal.setAttribute("aria-hidden", "true");
        modalBody.innerHTML = "";
      }

      // Events
      deck.addEventListener("scroll", () => {
        // throttle via rAF
        window.requestAnimationFrame(updateFromScroll);
      });

      btnPrev.addEventListener("click", ()=>scrollToSlide(current - 1));
      btnNext.addEventListener("click", ()=>scrollToSlide(current + 1));

      btnHelp.addEventListener("click", ()=>{
        openModal("AIDE", `
          <div class="card">
            <div class="card__t">🧭 Navigation</div>
            <div class="card__d">
              • Scroll pour avancer<br>
              • <b>←</b>/<b>→</b> : slide précédente/suivante<br>
              • <b>Esc</b> : fermer les fenêtres<br>
              • Clique sur les bandeaux “Ressources” pour ouvrir une fiche
            </div>
          </div>
          <div class="card">
            <div class="card__t">📝 Conseils visio</div>
            <div class="card__d">
              • Gros titres, messages courts<br>
              • 1 idée par slide<br>
              • Beaucoup d’air (lisible sur Teams)
            </div>
          </div>
        `);
      });

      // Modal close
      modal.addEventListener("click", (e)=>{
        const t = e.target;
        if(t && t.getAttribute && t.getAttribute("data-close")==="1") closeModal();
      });

      // Click delegation for banners
      document.addEventListener("click", (e)=>{
        const el = e.target.closest?.("[data-modal='1']");
        if(!el) return;
        const title = el.getAttribute("data-title") || "Ressource";
        const body  = el.getAttribute("data-body") || "";
        openModal(title, `<p style="margin:0; color:#52607a; font-size:16px; line-height:1.45">${escapeHtml(body)}</p>`);
      });

      // Keyboard navigation
      document.addEventListener("keydown", (e)=>{
        if(modal.getAttribute("aria-hidden")==="false" && e.key === "Escape") closeModal();

        if(e.key === "ArrowRight") scrollToSlide(current + 1);
        if(e.key === "ArrowLeft") scrollToSlide(current - 1);

        // Optional: up/down jump slide (not per pixel)
        if(e.key === "ArrowDown") scrollToSlide(current + 1);
        if(e.key === "ArrowUp") scrollToSlide(current - 1);
      });

      // Init
      renderSlides();

    })();
  </script>
</body>
</html>
